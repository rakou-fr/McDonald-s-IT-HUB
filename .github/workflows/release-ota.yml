name: Release OTA Update (GitHub)

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Web App
        run: npm run build

      - name: Compress dist directory and calculate SHA256
        id: prepare_ota
        run: |
          cd dist && zip -r ../dist.zip . && cd ..
          HASH=$(sha256sum dist.zip | cut -d ' ' -f 1)
          echo "CHECKSUM=$HASH" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          body: "SHA256: ${{ steps.prepare_ota.outputs.CHECKSUM }}"
          files: dist.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}